[project]
name = "anywidget-kanban-board"
version = "0.1.1"
description = "A basic implementation of a kanban board widget for anywidget"
readme = "README.md"
license = "MIT"
authors = [
    { name = "insolor", email = "insolor@gmail.com" }
]
keywords = [
    "anywidget",
    "marimo",
    "widget",
    "kanban-board",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12"
dependencies = [
    "anywidget>=0.11.0",
]

[project.scripts]
anywidget-kanban-board = "anywidget_kanban_board:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "example",
    ".",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",
    "D",
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"example/*" = [
    "ANN001",
    "ANN202",
    "B018",
    "INP001",
    "PLR1711",
]
